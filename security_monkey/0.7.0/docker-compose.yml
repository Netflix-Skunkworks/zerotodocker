---

###
#
# Documentation: http://securitymonkey.readthedocs.io/en/latest/index.html
#
# shortcuts
# open https://$(docker-machine active | xargs docker-machine ip)
#
###

version: '2'
# volumes:
#    - postgres-data: {}
services:
  postgres:
    container_name: db
    image: postgres:9
    # volumes:
    #    - ./postgres-data/:/var/lib/postgresql/data

  init:
    container_name: init
    build: .
    depends_on:
      - postgres
    env_file: secmonkey.env
    volumes:
      - ./config-deploy.py:/usr/local/src/security_monkey/env-config/config-deploy.py
      - ./api-init.sh:/usr/local/src/security_monkey/scripts/api-init.sh
      - ./api-start.sh:/usr/local/src/security_monkey/scripts/api-start.sh
      - ./scheduler-start.sh:/usr/local/src/security_monkey/scripts/scheduler-start.sh
    entrypoint: # ["/usr/local/src/security_monkey/scripts/api-init.sh"]
      - sleep
      - 8h
    
  api:
    container_name: api
    build: .
    depends_on:
      - postgres
    env_file: secmonkey.env
    volumes_from:
      - init
    entrypoint: ["/usr/local/src/security_monkey/scripts/api-start.sh"]
    
  scheduler:
    container_name: scheduler
    build: .
    depends_on:
      - api
    env_file: secmonkey.env
    entrypoint: ["/usr/local/src/security_monkey/scripts/scheduler-start.sh"]
    volumes_from:
      - init

  nginx:
    container_name: nginx
    build:
      context: ./security_monkey-nginx
    working_dir: /etc/nginx
    volumes:
      - ./security_monkey-nginx/server.crt:/etc/nginx/ssl/server.crt
      - ./security_monkey-nginx/server.key:/etc/nginx/ssl/server.key
      - ./security_monkey-nginx/nginx-start.sh:/usr/local/src/security_monkey/scripts/nginx-start.sh
    depends_on:
      - api
    ports:
      - 80:80
      - 443:443
    links:
      - api:smapi
